syntax = "proto3";

package agynio.api.gateway.v1;

import "agynio/api/terminal_proxy/v1/terminal_proxy.proto";

option go_package = "github.com/agynio/api/gen/agynio/api/gateway/v1;gatewayv1";

service TerminalGateway {
  rpc CreateTerminalSession(CreateTerminalSessionRequest) returns (CreateTerminalSessionResponse);
}

message CreateTerminalSessionRequest {
  string workload_id = 1;
  string container_name = 2;

  // The command to run. Meaningful only when kind is EXEC; every other kind
  // has a platform-defined command and ignores this field.
  optional agynio.api.terminal_proxy.v1.TerminalCommand command = 3;

  // Required. UNSPECIFIED is rejected with InvalidArgument.
  agynio.api.terminal_proxy.v1.SessionKind kind = 4;

  // The directory to serve. Meaningful only when kind is SYNC. Must be
  // absolute.
  string sync_root = 5;

  // Names the shell to attach to. Required when kind is SHELL_ATTACH and
  // ignored otherwise. Opaque, ^[A-Za-z0-9_-]{1,64}$.
  string shell_id = 6;

  // Working directory for the shell, applied only when it has to be created.
  // Optional; must be absolute when set.
  string shell_cwd = 7;
}

message CreateTerminalSessionResponse {
  string ticket = 1;
  string websocket_url = 2;
  int32 expires_in_seconds = 3;
}
