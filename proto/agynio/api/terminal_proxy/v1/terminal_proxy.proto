syntax = "proto3";

package agynio.api.terminal_proxy.v1;

option go_package = "github.com/agynio/api/gen/agynio/api/terminal_proxy/v1;terminalproxyv1";

// TerminalProxyService issues short-lived terminal session tickets.
service TerminalProxyService {
  rpc IssueTicket(IssueTicketRequest) returns (IssueTicketResponse);
}

// SessionKind selects what runs in the container. The command for each kind is
// platform-defined and bound into the ticket at issuance, so a client never
// supplies one and cannot change it at attach time.
enum SessionKind {
  // Rejected with InvalidArgument. It does not default to SHELL: silently
  // defaulting the field that selects a command is how an unintended command
  // ends up in a ticket.
  SESSION_KIND_UNSPECIFIED = 0;

  // A login shell on a PTY, with the platform binaries on PATH. Ephemeral: the
  // PTY closes with the connection, as a dropped SSH connection does.
  SESSION_KIND_SHELL = 1;

  // A caller-supplied command on a PTY. Carries no more privilege than SHELL —
  // binding the command at issuance buys immutability, not permission.
  SESSION_KIND_EXEC = 2;

  // The workspace sync endpoint. Non-TTY: no PTY, no resize, and stdout kept
  // separate from stderr so diagnostics cannot corrupt protocol frames.
  SESSION_KIND_SYNC = 3;

  // Attach to a persistent shell, creating it when it does not exist. The PTY
  // belongs to a process in the container and outlives this session; the next
  // session attaches to the same one. A second session displaces the first —
  // one shell carries one attachment.
  //
  // A separate kind rather than a flag on SHELL, so the command stays a
  // function of the kind and its parameters.
  SESSION_KIND_SHELL_ATTACH = 4;
}

message IssueTicketRequest {
  // Authenticated identity supplied by Gateway from request context. This
  // field is internal service-to-service data and must never come from client
  // input.
  string identity_id = 1;
  string workload_id = 2;
  string container_name = 3;

  // The command to run. Meaningful only when kind is EXEC; every other kind
  // has a platform-defined command and ignores this field.
  TerminalCommand command = 4;

  SessionKind kind = 5;

  // The directory to serve. Meaningful only when kind is SYNC. Must be
  // absolute; it is normalized before being bound into the ticket, and
  // resolved against the real filesystem inside the container.
  string sync_root = 6;

  // Names the shell to attach to. Required when kind is SHELL_ATTACH and
  // ignored otherwise. Client-generated and opaque, matching
  // ^[A-Za-z0-9_-]{1,64}$ — '.' and ':' are excluded because the multiplexer
  // behind a shell reads them as target separators.
  //
  // Not a capability: anyone who may open a shell in a container can reach
  // every shell in it from inside. Keeping one identity's shells out of
  // another's view is the layout owner's decision, not this service's.
  string shell_id = 7;

  // Working directory for the shell, applied only when it has to be created
  // and ignored when it already exists — so a caller may pass its stored value
  // on every attach. Optional. Must be absolute; normalized before being bound
  // into the ticket, as sync_root is.
  string shell_cwd = 8;
}

message IssueTicketResponse {
  string ticket = 1;
  string websocket_url = 2;
  int32 expires_in_seconds = 3;
}

message TerminalCommand {
  oneof command {
    string shell = 1;
    TerminalArgv argv = 2;
  }
}

message TerminalArgv {
  repeated string argv = 1;
}
